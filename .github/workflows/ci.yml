name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.23', '1.24']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true

      - name: Verify dependencies
        run: |
          go mod verify

      - name: Static Analysis (go vet)
        run: |
          go vet ./...

      - name: Run Test Suite
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            go test -v ./...
          else
            go test -race -v ./...
          fi

      - name: Compile Native Binary
        shell: bash
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/lazylocal${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/lazylocal

      - name: Binary Smoke Tests
        shell: bash
        run: |
          ./dist/lazylocal${{ runner.os == 'Windows' && '.exe' || '' }} --version
          ./dist/lazylocal${{ runner.os == 'Windows' && '.exe' || '' }} url --json
          ./dist/lazylocal${{ runner.os == 'Windows' && '.exe' || '' }} sweep --dry-run
