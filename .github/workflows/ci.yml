name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.23', '1.24']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true

      - name: Verify dependencies
        run: |
          go mod verify

      - name: Static Analysis (go vet)
        run: |
          go vet ./...

      - name: Run Test Suite with Race Detector
        run: |
          go test -race -v ./...

      - name: Compile Native Binary
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/lazylocal ./cmd/lazylocal

      - name: Binary Smoke Tests
        run: |
          ./dist/lazylocal --version
          ./dist/lazylocal url --json
          ./dist/lazylocal sweep --dry-run
