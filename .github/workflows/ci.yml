name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.23', '1.24']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true

      - name: Verify dependencies
        run: |
          go mod verify

      - name: Static Analysis (go vet)
        run: |
          go vet ./...

      - name: Run Test Suite
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            go test -v ./...
          else
            go test -race -v ./...
          fi

      - name: Run govulncheck
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.24'
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Run Go Fuzz Tests (Proxy, Config, TUI)
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.24'
        run: |
          go test -fuzz=FuzzRedactSensitiveBody -fuzztime=3s ./internal/proxy
          go test -fuzz=FuzzCurlCommand -fuzztime=3s ./internal/proxy
          go test -fuzz=FuzzParsePins -fuzztime=3s ./internal/config
          go test -fuzz=FuzzSanitizeTerm -fuzztime=3s ./internal/tui

      - name: Compile Native Binary
        shell: bash
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/lazylocal${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/lazylocal
          cp dist/lazylocal${{ runner.os == 'Windows' && '.exe' || '' }} ./lazylocal${{ runner.os == 'Windows' && '.exe' || '' }}

      - name: Binary Smoke Tests
        shell: bash
        run: |
          ./dist/lazylocal${{ runner.os == 'Windows' && '.exe' || '' }} --version
          ./dist/lazylocal${{ runner.os == 'Windows' && '.exe' || '' }} url --json
          ./dist/lazylocal${{ runner.os == 'Windows' && '.exe' || '' }} sweep
          ./dist/lazylocal${{ runner.os == 'Windows' && '.exe' || '' }} sweep --dry-run

      - name: Build Cross-Platform Release Artifacts & Checksums
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.24' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist/release
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w -X main.version=0.1.0" -o dist/release/lazylocal-darwin-arm64 ./cmd/lazylocal
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w -X main.version=0.1.0" -o dist/release/lazylocal-darwin-amd64 ./cmd/lazylocal
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X main.version=0.1.0" -o dist/release/lazylocal-linux-arm64 ./cmd/lazylocal
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.version=0.1.0" -o dist/release/lazylocal-linux-amd64 ./cmd/lazylocal
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -X main.version=0.1.0" -o dist/release/lazylocal-windows-amd64.exe ./cmd/lazylocal
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -ldflags="-s -w -X main.version=0.1.0" -o dist/release/lazylocal-windows-arm64.exe ./cmd/lazylocal
          (cd dist/release && sha256sum lazylocal-* > checksums.txt)

      - name: Attest Build Provenance (Sigstore / SLSA)
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.24' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/release/lazylocal-*'

      - name: Upload Attested Release Artifacts
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.24' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.1.0 dist/release/* --clobber
