name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.23', '1.24']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true

      - name: Verify dependencies
        run: |
          go mod verify

      - name: Static Analysis (go vet)
        run: |
          go vet ./...

      - name: Run Test Suite
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            go test -v ./...
          else
            go test -race -v ./...
          fi

      - name: Run govulncheck
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.24'
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Run Go Fuzz Tests (Proxy, Config, TUI)
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.24'
        run: |
          go test -fuzz=FuzzRedactSensitiveBody -fuzztime=3s ./internal/proxy
          go test -fuzz=FuzzCurlCommand -fuzztime=3s ./internal/proxy
          go test -fuzz=FuzzParsePins -fuzztime=3s ./internal/config
          go test -fuzz=FuzzSanitizeTerm -fuzztime=3s ./internal/tui

      - name: Compile Native Binary
        shell: bash
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/lazylocal${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/lazylocal
          cp dist/lazylocal${{ runner.os == 'Windows' && '.exe' || '' }} ./lazylocal${{ runner.os == 'Windows' && '.exe' || '' }}

      - name: Binary Smoke Tests
        shell: bash
        run: |
          ./dist/lazylocal${{ runner.os == 'Windows' && '.exe' || '' }} --version
          ./dist/lazylocal${{ runner.os == 'Windows' && '.exe' || '' }} url --json
          ./dist/lazylocal${{ runner.os == 'Windows' && '.exe' || '' }} sweep
          ./dist/lazylocal${{ runner.os == 'Windows' && '.exe' || '' }} sweep --dry-run

